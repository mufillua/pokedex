<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="./javascript/setup.js?v=4"></script>
    <script src="./javascript/list.js?v=4"></script>
    <script src="./javascript/details.js?v=4"></script>
    <link rel="stylesheet" href="style.css?v=4" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
      integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm"
      crossorigin="anonymous"
    />
  </head>
  <body onload="getAllNames()" class="row">
    <!--Setup Loading Div-->
    <div id="loading-div">
      <img src="src/pokeball-icon.png" class="loading-ball" />
    </div>

    <!--Search Bar and render search pokemon-->
    <div id="pokedex-list" class="column">
      <!--Sticky search bar-->
      <div id="sticky-header">
        <div id="search-bar-container" class="row container">
          <input id="search-input" oninput="search()" placeholder="Search Pokémon by name or number" />
          <div id="start-search-button" class="center" onclick="search()">
            <i class="fas fa-search"></i>
          </div>
        </div>
      </div>

      <!--Filters-->
      <div id="filters-wrap">
        <div id="sort-range-row">
          <div class="dropdown" id="sort-dd" data-value="num-asc">
            <button class="sort-btn" data-popover="sort-dd" onclick="toggleFilterMenu('sort-dd')">
              <span class="label">Ascending</span><i class="fas fa-chevron-down caret"></i>
            </button>
          </div>
          <span id="result-count"></span>
          <div class="range">
            <b>from</b>
            <input id="range-from" type="number" min="1" max="1025" value="1" oninput="search()" />
            <b>to</b>
            <input id="range-to" type="number" min="1" max="1025" value="1025" oninput="search()" />
          </div>
        </div>

        <div id="filter-row">
          <button class="filter-pill" data-popover="type-panel" onclick="toggleFilterMenu('type-panel')">
            <i class="fas fa-bullseye"></i><span class="label">Type</span><span id="type-count" class="badge hide"></span><i class="fas fa-chevron-down caret"></i>
          </button>
          <button class="filter-pill" data-popover="weak-panel" onclick="toggleFilterMenu('weak-panel')">
            <i class="fas fa-heart-broken"></i><span class="label">Weaknesses</span><span id="weak-count" class="badge hide"></span><i class="fas fa-chevron-down caret"></i>
          </button>
          <div class="dropdown align-right" id="generation-dd" data-value="all">
            <button class="filter-pill" data-popover="generation-dd" onclick="toggleFilterMenu('generation-dd')">
              <i class="fas fa-layer-group"></i><span class="label">Generation</span><i class="fas fa-chevron-down caret"></i>
            </button>
          </div>
          <div class="dropdown align-right" id="ability-dd" data-value="all">
            <button class="filter-pill" data-popover="ability-dd" onclick="toggleFilterMenu('ability-dd')">
              <i class="fas fa-bolt"></i><span class="label">Ability</span><i class="fas fa-chevron-down caret"></i>
            </button>
          </div>
          <div class="dropdown" id="height-dd" data-value="all">
            <button class="filter-pill" data-popover="height-dd" onclick="toggleFilterMenu('height-dd')">
              <i class="fas fa-ruler-vertical"></i><span class="label">Height</span><i class="fas fa-chevron-down caret"></i>
            </button>
          </div>
          <div class="dropdown align-right" id="weight-dd" data-value="all">
            <button class="filter-pill" data-popover="weight-dd" onclick="toggleFilterMenu('weight-dd')">
              <i class="fas fa-weight-hanging"></i><span class="label">Weight</span><i class="fas fa-chevron-down caret"></i>
            </button>
          </div>
          <button id="reset-filters" class="reset" onclick="clearFilters()" aria-label="Reset filters">
            <i class="fas fa-redo-alt"></i><span class="reset-text">Reset</span>
          </button>
        </div>

        <div id="type-panel" class="container chip-panel"></div>
        <div id="weak-panel" class="container chip-panel"></div>
      </div>

      <div id="pokedex-list-render-container">
        <!--Render here-->
      </div>
    </div>

    <!--responsive current pokemon-->
    <div id="current-pokemon-responsive-background" class="hide"></div>
    <div
      id="current-pokemon-responsive-close"
      class="hide"
      onclick="closePokemonInfo()"
    >
      <img src="src/close-icon.png" />
    </div>

    <!--current selected pokemon-->
    <div id="current-pokemon-container" class="container column center">
      <img id="current-pokemon-image" src="src/no-pokemon-selected-image.png" />

      <!--Info-->
      <div id="current-pokemon-info" class="hide">
        <!--Id-->
        <span id="current-pokemon-id" class="font-size-12 bold">#213</span>

        <!--name-->
        <h2 id="current-pokemon-name">Pikachu</h2>
        <span id="current-pokemon-genus" class="font-size-12"></span>

        <!--types-->
        <div id="current-pokemon-types" class="row center"></div>

        <!--description-->
        <h4>Pokedex Entry</h4>
        <span id="current-pokemon-description"></span>

        <!--height and weight-->
        <div class="row center">
          <div class="width-100 column center margin-5">
            <h4>Height</h4>
            <div
              id="current-pokemon-height"
              class="pokemon-info-variable-container"
            ></div>
          </div>
          <div class="width-100 column center margin-5">
            <h4>Weight</h4>
            <div
              id="current-pokemon-weight"
              class="pokemon-info-variable-container"
            ></div>
          </div>
        </div>

        <!--weaknesses and base exp-->
        <div class="row center">
          <div class="column center margin-5" style="flex: 2">
            <h4>Weaknesses</h4>
            <div id="current-pokemon-weaknesses" class="pokemon-info-variable-container weak-wrap"></div>
          </div>
          <div class="column center margin-5" style="flex: 1">
            <h4>Base EXP</h4>
            <div id="current-pokemon-base-exp" class="pokemon-info-variable-container"></div>
          </div>
        </div>

        <!--abilities-->
        <div class="column">
          <h4>Abilities</h4>
          <div class="row">
            <div
              id="current-pokemon-abilitiy-0"
              class="pokemon-info-variable-container"
            ></div>
            <div
              id="current-pokemon-abilitiy-1"
              class="pokemon-info-variable-container"
            ></div>
          </div>
        </div>

        <!--stats-->
        <h4>Stats</h4>
        <div class="row center">
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #df2140">
              HP
            </div>
            <h5 id="current-pokemon-stats-hp">84</h5>
          </div>
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #ff994d">
              ATK
            </div>
            <h5 id="current-pokemon-stats-atk">84</h5>
          </div>
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #eecd3d">
              DEF
            </div>
            <h5 id="current-pokemon-stats-def">84</h5>
          </div>
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #85ddff">
              SpA
            </div>
            <h5 id="current-pokemon-stats-spa">84</h5>
          </div>
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #96da83">
              SpD
            </div>
            <h5 id="current-pokemon-stats-spd">84</h5>
          </div>
          <div class="current-pokemon-stats-container column">
            <div class="current-pokemon-stats-name" style="background: #fb94a8">
              SPD
            </div>
            <h5 id="current-pokemon-stats-speed">84</h5>
          </div>
          <div
            class="current-pokemon-stats-container column"
            style="background: #88aaea"
          >
            <div class="current-pokemon-stats-name" style="background: #7195dc">
              TOT
            </div>
            <h5 id="current-pokemon-stats-total">84</h5>
          </div>
        </div>

        <!--Evolution chain-->
        <div id="current-pokemon-evolution-chain-container">
          <h4>Evolution</h4>
          <div class="row center">
            <img
              id="current-pokemon-evolution-0"
              class="current-pokemon-evolution-image"
              src="./src/pokeball-icon.png"
            />
            <div
              id="current-pokemon-evolution-level-0"
              class="current-pokemon-evolution-level-container font-size-12 bold"
            >
              Lv. 16
            </div>
            <img
              id="current-pokemon-evolution-1"
              class="current-pokemon-evolution-image"
              src="./src/pokeball-icon.png"
            />
            <div
              id="current-pokemon-evolution-level-1"
              class="current-pokemon-evolution-level-container font-size-12 bold"
            >
              Lv. 36
            </div>
            <img
              id="current-pokemon-evolution-2"
              class="current-pokemon-evolution-image"
              src="./src/pokeball-icon.png"
            />
          </div>
        </div>
      </div>

      <!--Empty-->
      <div id="current-pokemon-empty">
        <span class="font-size-18">Select a Pokemon<br />to display here.</span>
      </div>
    </div>

    <!--Back to top button-->
    <div id="back-to-top-button" class="hide" onclick="backToTop()">
      <img src="src/arrow-up-icon.png" />
    </div>

    <!--Loading selected pokemon-->
    <img
      id="current-pokemon-loading"
      src="src/pokeball-icon.png"
      class="loading-ball"
    />
  </body>
</html>
